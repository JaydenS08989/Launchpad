name: Capture gameplay screenshot

on:
  push:
    branches:
      - chatgpt/capture-gameplay-20260908

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Apply capture-only PlayCanvas compatibility patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          old_init = "this.app=new pc.Application(this.canvas);await this.app.init({graphicsDeviceOptions:{deviceTypes:['webgpu','webgl2'],antialias:true,alpha:false},componentSystems:[pc.RenderComponentSystem,pc.CameraComponentSystem,pc.LightComponentSystem]});"
          new_init = "this.app=new pc.Application(this.canvas,{graphicsDeviceOptions:{antialias:true,alpha:false}});"
          if old_init not in text:
              raise SystemExit('Expected PlayCanvas double-init sequence not found')
          text = text.replace(old_init, new_init, 1)
          marker = "<script>\n'use strict';"
          shim = "<script>\nif(!pc.Color.fromString)pc.Color.fromString=value=>value instanceof pc.Color?value.clone():typeof value==='string'?new pc.Color().fromString(value):Array.isArray(value)?new pc.Color(value[0]??1,value[1]??1,value[2]??1,value[3]??1):value&&typeof value==='object'?new pc.Color(value.r??1,value.g??1,value.b??1,value.a??1):new pc.Color(1,1,1,1);\n'use strict';"
          if marker not in text:
              raise SystemExit('Expected main script marker not found')
          text = text.replace(marker, shim, 1)
          path.write_text(text)
          print('Applied runtime-only PlayCanvas compatibility patches')
          PY

      - name: Start game server
        run: |
          python3 -m http.server 4173 > /tmp/vice-horizon-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vice-horizon-server.log
          exit 1

      - name: Play and capture screenshot
        run: |
          cat > capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({
            headless: true,
            args: [
              '--use-angle=swiftshader',
              '--enable-unsafe-swiftshader',
              '--enable-webgl',
              '--ignore-gpu-blocklist',
              '--disable-dev-shm-usage'
            ]
          });

          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          page.on('console', msg => console.log(`[browser:${msg.type()}] ${msg.text()}`));
          page.on('pageerror', err => console.error(`[pageerror] ${err.message}`));
          page.on('requestfailed', req => console.error(`[requestfailed] ${req.url()} :: ${req.failure()?.errorText}`));

          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForFunction(() => document.querySelector('#title') && !document.querySelector('#title').classList.contains('hidden'), null, { timeout: 30000 });
          await page.waitForTimeout(1000);

          const readState = () => page.evaluate(() => ({
            loading: document.querySelector('#loading')?.className,
            title: document.querySelector('#title')?.className,
            hud: document.querySelector('#hud')?.className,
            compat: getComputedStyle(document.querySelector('#compat')).display,
            mission: document.querySelector('.mission')?.innerText,
            area: document.querySelector('.area')?.innerText
          }));

          const before = await readState();
          console.log('UI before start:', before);
          await page.screenshot({ path: 'prestart.png', fullPage: false });

          await page.keyboard.press('Space');
          await page.waitForFunction(() => document.querySelector('#hud')?.classList.contains('on'), null, { timeout: 10000 });
          await page.waitForTimeout(1800);

          await page.keyboard.down('ShiftLeft');
          await page.keyboard.down('KeyW');
          await page.waitForTimeout(2200);
          await page.keyboard.up('KeyW');
          await page.keyboard.up('ShiftLeft');
          await page.waitForTimeout(900);
          await page.keyboard.press('KeyN');
          await page.waitForTimeout(1200);

          const after = await readState();
          console.log('UI after input:', after);
          await page.screenshot({ path: 'gameplay.png', fullPage: false });
          fs.writeFileSync('capture-state.json', JSON.stringify({ before, after }, null, 2));

          await browser.close();
          EOF
          node capture.mjs

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vice-horizon-gameplay-screenshot
          path: |
            gameplay.png
            prestart.png
            capture-state.json
          if-no-files-found: warn
          retention-days: 7
