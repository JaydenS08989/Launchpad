name: Capture gameplay screenshot

on:
  push:
    branches:
      - chatgpt/capture-gameplay-20260908

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start game server
        run: |
          python3 -m http.server 4173 > /tmp/vice-horizon-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vice-horizon-server.log
          exit 1

      - name: Play and capture screenshot
        run: |
          cat > /tmp/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({
            headless: true,
            args: [
              '--use-gl=swiftshader',
              '--enable-webgl',
              '--ignore-gpu-blocklist',
              '--disable-dev-shm-usage'
            ]
          });

          const page = await browser.newPage({ viewport: { width: 1440, height: 900 } });
          page.on('console', msg => console.log(`[browser:${msg.type()}] ${msg.text()}`));
          page.on('pageerror', err => console.error(`[pageerror] ${err.message}`));

          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForTimeout(7000);

          const before = await page.evaluate(() => ({
            loading: document.querySelector('#loading')?.className,
            title: document.querySelector('#title')?.className,
            hud: document.querySelector('#hud')?.className,
            compat: getComputedStyle(document.querySelector('#compat')).display
          }));
          console.log('UI before start:', before);

          await page.keyboard.press('Space');
          await page.waitForTimeout(3500);

          // Exercise actual gameplay input before the capture.
          await page.keyboard.down('Shift');
          await page.keyboard.down('w');
          await page.waitForTimeout(1800);
          await page.keyboard.up('w');
          await page.keyboard.up('Shift');
          await page.waitForTimeout(1200);

          const after = await page.evaluate(() => ({
            loading: document.querySelector('#loading')?.className,
            title: document.querySelector('#title')?.className,
            hud: document.querySelector('#hud')?.className,
            mission: document.querySelector('.mission')?.innerText,
            area: document.querySelector('.area')?.innerText
          }));
          console.log('UI after input:', after);

          await page.screenshot({ path: 'gameplay.png', fullPage: false });
          fs.writeFileSync('capture-state.json', JSON.stringify({ before, after }, null, 2));
          await browser.close();
          EOF
          node /tmp/capture.mjs

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: vice-horizon-gameplay-screenshot
          path: |
            gameplay.png
            capture-state.json
          if-no-files-found: error
          retention-days: 7
