name: Capture updated gameplay video

on:
  push:
    branches:
      - chatgpt/capture-video-20260908
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out capture branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser tooling
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Apply capture-only PlayCanvas compatibility patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()

          old_init = "this.app=new pc.Application(this.canvas);await this.app.init({graphicsDeviceOptions:{deviceTypes:['webgpu','webgl2'],antialias:true,alpha:false,preserveDrawingBuffer:true},componentSystems:[pc.RenderComponentSystem,pc.CameraComponentSystem,pc.LightComponentSystem]});"
          new_init = "this.app=new pc.Application(this.canvas,{graphicsDeviceOptions:{antialias:true,alpha:false,preserveDrawingBuffer:true}});"
          if old_init in text:
              text = text.replace(old_init, new_init, 1)

          text = text.replace("this.velocity.lerp(target,1-Math.exp(-damp*dt))", "this.velocity.lerp(this.velocity,target,1-Math.exp(-damp*dt))", 1)
          text = text.replace("this.pos.lerp(desired,1-Math.exp(-8*dt))", "this.pos.lerp(this.pos,desired,1-Math.exp(-8*dt))", 1)

          marker = "<script>\n'use strict';"
          shim = "<script>\nif(!pc.Color.fromString)pc.Color.fromString=value=>value instanceof pc.Color?value.clone():typeof value==='string'?new pc.Color().fromString(value):Array.isArray(value)?new pc.Color(value[0]??1,value[1]??1,value[2]??1,value[3]??1):value&&typeof value==='object'?new pc.Color(value.r??1,value.g??1,value.b??1,value.a??1):new pc.Color(1,1,1,1);\n'use strict';"
          if marker in text:
              text = text.replace(marker, shim, 1)

          path.write_text(text)
          print('Applied capture-only compatibility patches')
          PY

      - name: Start game server
        run: |
          python3 -m http.server 4173 > /tmp/vice-horizon-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vice-horizon-server.log
          exit 1

      - name: Play and record updated game
        run: |
          cat > capture-video.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';

          const browser = await chromium.launch({
            headless: true,
            args: [
              '--use-angle=swiftshader',
              '--enable-unsafe-swiftshader',
              '--enable-webgl',
              '--ignore-gpu-blocklist',
              '--disable-dev-shm-usage'
            ]
          });

          const context = await browser.newContext({
            viewport: { width: 1280, height: 720 },
            recordVideo: { dir: 'recordings', size: { width: 1280, height: 720 } }
          });
          const page = await context.newPage();
          page.on('console', msg => console.log(`[browser:${msg.type()}] ${msg.text()}`));
          page.on('pageerror', err => console.error(`[pageerror] ${err.message}`));
          page.on('requestfailed', req => console.error(`[requestfailed] ${req.url()} :: ${req.failure()?.errorText}`));

          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.waitForFunction(() => document.querySelector('#title') && !document.querySelector('#title').classList.contains('hidden'), null, { timeout: 30000 });
          await page.waitForTimeout(1800);

          await page.keyboard.press('Space');
          await page.waitForFunction(() => document.querySelector('#hud')?.classList.contains('on'), null, { timeout: 10000 });
          await page.waitForTimeout(1800);

          // Sprint through Ocean Avenue.
          await page.keyboard.down('ShiftLeft');
          await page.keyboard.down('KeyW');
          await page.waitForTimeout(3200);
          await page.keyboard.up('KeyW');
          await page.keyboard.up('ShiftLeft');
          await page.waitForTimeout(700);

          // Showcase the updated weapon selector and HUD.
          await page.keyboard.press('Tab');
          await page.waitForTimeout(1200);
          await page.keyboard.press('Tab');
          await page.waitForTimeout(1200);

          // Aim and fire briefly to exercise the combat HUD / awareness state.
          await page.mouse.down({ button: 'right' });
          await page.waitForTimeout(500);
          for (let i = 0; i < 3; i++) {
            await page.mouse.down({ button: 'left' });
            await page.waitForTimeout(120);
            await page.mouse.up({ button: 'left' });
            await page.waitForTimeout(350);
          }
          await page.mouse.up({ button: 'right' });
          await page.waitForTimeout(1000);

          // Change lighting to sunset and move again for a distinct final shot.
          await page.keyboard.press('KeyN');
          await page.waitForTimeout(1600);
          await page.keyboard.down('KeyA');
          await page.keyboard.down('KeyW');
          await page.waitForTimeout(2600);
          await page.keyboard.up('KeyW');
          await page.keyboard.up('KeyA');
          await page.waitForTimeout(1800);

          const state = await page.evaluate(() => {
            const g = Game.instance;
            const vec = v => v ? { x: v.x, y: v.y, z: v.z } : null;
            return {
              hud: document.querySelector('#hud')?.className,
              weapon: document.querySelector('.weapon-name')?.textContent,
              ammo: document.querySelector('.ammo')?.innerText,
              area: document.querySelector('.area')?.innerText,
              mission: document.querySelector('.mission')?.innerText,
              player: vec(g?.player?.entity?.getPosition()),
              camera: vec(g?.camera?.entity?.getPosition()),
              drawCalls: g?.app?.stats?.drawCalls?.total ?? null
            };
          });
          console.log('Final gameplay state:', state);
          fs.writeFileSync('capture-state.json', JSON.stringify(state, null, 2));
          await page.screenshot({ path: 'video-final-frame.png' });

          const video = page.video();
          await context.close();
          const recordedPath = await video.path();
          fs.copyFileSync(recordedPath, 'vice-horizon-updated-gameplay.webm');
          await browser.close();
          EOF

          node capture-video.mjs
          ffmpeg -y -i vice-horizon-updated-gameplay.webm -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -movflags +faststart vice-horizon-updated-gameplay.mp4

      - name: Upload gameplay video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vice-horizon-updated-gameplay-video
          path: |
            vice-horizon-updated-gameplay.mp4
            vice-horizon-updated-gameplay.webm
            video-final-frame.png
            capture-state.json
          if-no-files-found: warn
          retention-days: 7
